name: Compatibility

on: [push, pull_request]

jobs:
  sentence-transformers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            sentence-transformers: "5.0.0"
            transformers: "4.57.6"
            torch: "2.7.1"
          - python: "3.12"
            sentence-transformers: "5.4.0"
            transformers: "5.3.0"
            torch: "2.12.1"
          - python: "3.12"
            sentence-transformers: "6.3.0"
            transformers: "5.24.1"
            torch: "2.12.1"
    env:
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - run: >
          python -m pip install '.[test]'
          sentence-transformers==${{ matrix.sentence-transformers }}
          transformers==${{ matrix.transformers }}
      - run: python -m pytest -q
